# Protected promotion policy. Read only from the operator's protected checkout
# (HERMES_IMPROVE_CONFIG); candidate diffs touching config/ are rejected.
# Defaults are identical to hermes_improve.config.PromotionConfig.
schema_version: 1
policy_version: "1"
thresholds:
  max_critical_regressions: 0
  max_high_regressions: 0
  max_medium_regression_rate: 0.01
  min_quality_delta: 3.0
  max_category_drop: 2.0
  max_token_increase_ratio: 0.1
  max_latency_increase_ratio: 0.15
  # Generalization: mean quality delta of the sealed holdout alone must be at
  # least this (Full rows cannot carry a holdout regression), and holdout task
  # success must not drop.
  min_holdout_quality_delta: 0.0
  # Exceptions (spec §23 "unless significant quality gain" / "unless
  # justified"): a token or latency increase above its ratio is allowed only
  # when there are at least two final tasks and the 95% CI lower bound of the
  # pooled Full+holdout quality delta is strictly above this value.
  # null disables the exception.
  token_exception_min_quality_ci_lower: 3.0
  latency_exception_min_quality_ci_lower: 3.0
# Token efficiency is a hard constraint. true: final evidence whose runner did
# not report token usage fails with "token efficiency not measured". Set false
# only for benchmark sets without a model in the loop (deterministic command
# runners); the policy then records the token check as skipped.
require_token_measurement: true
# auto   = may promote after the full evidence gate
# manual = additionally requires an Ed25519-signed operator approval
# Unlocking a type means changing its gate here (and normally bumping
# policy_version so earlier evaluations no longer match).
# A candidate whose diff deletes a brain/skills/<name>/SKILL.md (Curator
# archive, delete, consolidate; any merge or split that drops a skill) always
# needs the signed operator approval, whatever its type gate says here.
promotion_gates:
  SKILL_CREATE: auto
  SKILL_PATCH: auto
  SKILL_MERGE: auto
  SKILL_SPLIT: auto
  TOOL_DESCRIPTION: manual
  WORKFLOW: manual
  ROUTING: manual
  MCP_TOOL_FILTER: manual
  MCP_CONFIG: manual
  SYSTEM_PROMPT: manual
  TOOL_CREATE: manual
  TOOL_PATCH: manual
# FULL and SEALED_HOLDOUT are mandatory and cannot be removed.
required_evidence_suites: [SMOKE, CORE, FULL, SEALED_HOLDOUT]
