[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-self-improvement"
version = "0.1.0"
description = "Safety-gated evaluation and improvement foundations for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ChillCodeForge" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hermes-improve = "hermes_improve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
