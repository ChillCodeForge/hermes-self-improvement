# Production deployment for the shop backend.
# Image tags are bumped by the release manager only.
services:
  api:
    image: registry.example.com/shop/api:1.4.2  # current API release
    replicas: 3
    env:
      LOG_LEVEL: info
  worker:
    image: registry.example.com/shop/worker:1.4.2
    replicas: 2
